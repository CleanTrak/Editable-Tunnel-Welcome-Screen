<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<script>
/*
  SETTINGS

  This is the only part of the file you should need to change.

  How to change a setting:
  - Change the words inside the quotes, or change the number.
  - Don't delete the quotes or the comma at the end of the line.
  - true means on, false means off.
  - Anything after // is a note. The screen ignores it.
  - Save the file, then refresh the page to see your change.

  Some things to know:
  - px means pixels (the tiny dots on the screen). '22px' is a size.
  - Times are in milliseconds. 1000 = 1 second.
  - A color can be a code like '#0879bd' or a name like 'red'.
    rgba(8,121,189,0.25) is a see-through color. The last number is how
    solid it is (0 = invisible, 1 = solid).
  - padding: '10px 20px' means 10px on the top and bottom, 20px on the sides.
*/
const CONFIG = {

  // 1. GENERAL
  general: {
    pageTitle: 'Waves Car Wash — Queue Display',   // name shown on the browser tab
    clock: {
      updateInterval: 1000,                          // how often the clock updates (1000 = every second)
      locale: [],                                    // leave as [] to use the device's language, or put 'en-US'
      // To show seconds too, change the next line to:
      // format: { hour: '2-digit', minute: '2-digit', second: '2-digit' }
      format: { hour: '2-digit', minute: '2-digit' }
    }
  },

  // 2. CLEANTRAK CONNECTION
  // Fill in the 3 values that say INSERT-...-HERE. Each site has its own.
  api: {
    ip:            'INSERT-IP-HERE',                 // address of the CleanTrak controller, like '192.168.1.50'
    port:          5000,                             // leave as 5000 unless told otherwise
    queueEndpoint: '/api/washQueue/cars',            // don't change
    // Both tunnels share one list of cars, so this tells the screen which tunnel is yours.
    tunnelId:      'INSERT-TUNNEL-ID-HERE',          // looks like '51b72d29-3b6c-4dfe-84f8-84d449013201'
    apiKey:        'INSERT-API-KEY-HERE',            // works like a password, keep it private
    authScheme:    'Bearer',                         // don't change
    pollInterval:  3000                              // how often to check for a new car (3000 = 3 seconds)
  },

  // 3. WHICH CAR SHOWS UP, AND FOR HOW LONG
  queue: {
    // A car only shows up when all of these are true, and it's in your tunnel:
    nextUpPosition: 1,           // its spot in line (1 = first)
    nextUpState:    'IN_QUEUE',  // its status in CleanTrak (capital letters don't matter)
    minImages:      2,           // it has at least this many photos (one from the lane, one from the roller-up)
    preferredImage: 1,           // which photo to show. 0 = first photo, 1 = second. Uses the first if the second is missing.
    holdTime:       7000         // how long a car stays up after it leaves the front of the line (7000 = 7 seconds)
  },

  // 4. WASH PACKAGES
  packages: {
    // The color for each package. The screen goes down this list and uses the
    // first one whose match word is in the package name.
    // badge is optional. It shows a small picture next to the package name.
    rules: [
      { match: 'ultimate', color: '#6DC84B', badge: 'Graphene.png', badgeAlt: 'Graphene Shield' },
      { match: 'extreme',  color: '#4BC8E8' },
      { match: 'basic',    color: '#F5A623' }
    ],
    defaultColor: '#4BC8E8',     // color for any package not in the list above
    ghostKeyword: 'ghost'        // if the package name is blank or has this word in it, the package isn't shown
  },

  // 5. WORDS ON THE SCREEN
  text: {
    // car = words above the card when a car is showing.
    // eyebrow is the small top line, headline is the big line, subline is the line under it.
    car:  { eyebrow: 'Now Entering', headline: 'THANK YOU', subline: 'Pull forward and enjoy your wash' },
    // idle = words when no car is waiting. title and message go inside the welcome box.
    idle: { eyebrow: 'Welcome', headline: '', subline: 'Drive up to begin your wash',
            title: 'Welcome', message: 'Waiting for next car' },
    labels: { plate: 'License Plate', customer: 'Customer', package: 'Wash Package' },   // small titles on the card
    noImage:      'No Image',    // shown when there's no photo of the car
    guestName:    'Guest',       // shown when there's no customer name
    unknownPlate: '?',           // shown when there's no license plate
    vehicleAlt:   'Vehicle'      // describes the car photo for blind users (screen readers)
  },

  // 6. LOGO AND PICTURES
  // Picture files need to be in the same folder as this file.
  branding: {
    name:           'Waves Car Wash',          // business name, used to describe the logo
    logo:           'ColorTransparent.png',    // logo in the top bar
    jeepSticker:    'JeepStickerFINAL.png',    // jeep used in the corners, in the welcome box, and when there's no car photo
    // The font (letter style) to download. Put '' to skip it.
    // If you change this, also change fontFamily in section 9.
    fontStylesheet: 'https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap'
    // Package badge pictures are set in section 4.
  },

  // 7. TURN THINGS ON OR OFF (true = on, false = off)
  features: {
    showLogo:           true,
    showClock:          true,
    showHeadline:       true,    // the words above the card
    showCornerStickers: true,    // jeeps in the bottom corners
    showWaves:          true,    // waves along the bottom
    showVehicleImage:   true,    // photo of the car
    showCustomerName:   true,
    showWashPackage:    true,
    showPackageBadge:   true     // small picture next to the package name
  },

  // 8. COLORS
  // Package colors are in section 4.
  theme: {
    colors: {
      brand:          '#0879bd',                  // main blue. Line under the top bar and stripe on the plate
      brandLight:     '#3aa3e3',                  // light blue. Small titles and the start of the big headline
      dark:           '#0d0d0d',                  // borders and the plate number
      text:           '#ffffff',                  // main text color
      textMuted:      'rgba(255,255,255,0.65)',   // the line under the headline
      divider:        'rgba(8,121,189,0.25)',     // thin lines between rows on the card
      background:     '#2DA2D8',                  // page background at the top
      backgroundEnd:  '#2496c8',                  // page background at the bottom
      backgroundGlow: 'rgba(8,121,189,0.22)'      // soft glow at the top of the page
    },
    header:   { background: 'rgba(3,11,22,0.9)',                // top bar
                backgroundRotated: 'rgba(3,11,22,0.96)' },  // top bar when forcePortrait is on
    headline: { gradientMiddle: '#80caef' },                     // middle color of the big headline
    card: {
      background:      '#050e1a',                 // car card and welcome box
      shadow:          '0 20px 60px rgba(0,0,0,0.7)',
      imageBackground: '#020810',                 // behind the car photo
      imageFade:       'rgba(5,14,26,0.8)',       // dark fade at the bottom of the photo
      noImageText:     'rgba(8,121,189,0.3)'      // the "No Image" words
    },
    // License plate. bolt = the two screws on the sides.
    plate: {
      backgroundTop:    '#f6f5ef',
      backgroundBottom: '#deded4',
      shadow:           'rgba(0,0,0,0.55)',
      highlight:        'rgba(255,255,255,0.9)',
      textShadow:       '0 1px 0 rgba(255,255,255,0.55)',
      boltLight:        '#ccc',
      boltDark:         '#888',
      boltBorder:       '#555',
      boltShadow:       'inset 0 1px 2px rgba(0,0,0,0.4)'
    },
    // Welcome box (shown when no car is waiting)
    idle: {
      outline:      'rgba(8,121,189,0.2)',
      titleColor:   '#ffffff',
      titleShadow:  '0 2px 16px rgba(0,0,0,0.6)',
      messageColor: 'rgba(255,255,255,0.7)'
    },
    bubbles: { center: 'rgba(8,121,189,0.18)', edge: 'rgba(58,163,227,0.02)', border: 'rgba(8,121,189,0.2)' },
    waves:   { back: 'rgba(8,121,189,0.1)', middle: 'rgba(58,163,227,0.07)', front: 'rgba(3,17,31,0.7)' },
    opacity: {                                    // how solid things are. 0 = invisible, 1 = solid
      eyebrow:        0.85,
      fieldLabel:     0.7,
      vehicleImage:   0.93,
      noImageJeep:    0.35,
      idleJeep:       0.25,
      cornerStickers: 0.13
    }
  },

  // 9. LETTERS (size and style)
  // These are for a wide (landscape) screen. Sizes for a tall screen are in section 11.
  // weight = how thick the letters are (400 = normal, 900 = very bold)
  // letterSpacing = space between letters. lineHeight = space between lines.
  typography: {
    fontFamily: "'Montserrat', sans-serif",   // font name
    baseSize:   '22px',          // text size. On a wide screen all text uses this size
    clock:       { weight: 800, letterSpacing: '3px' },
    eyebrow:     { weight: 700, letterSpacing: '5px' },
    headline:    { weight: 900, letterSpacing: '2px', lineHeight: 1 },
    subline:     { weight: 400, letterSpacing: '1px' },
    // On the welcome screen these two lines get bigger on bigger screens.
    // scale = % of the screen width, but never smaller than min or bigger than max.
    idleEyebrow: { min: '24px', scale: 4, max: '48px' },
    idleSubline: { min: '30px', scale: 6, max: '72px', weight: 600 },
    fieldLabel:  { weight: 700, letterSpacing: '5px' },   // small titles like "License Plate" and "Customer"
    plateNumber: { weight: 900, letterSpacing: '8px' },   // long plates shrink on their own to fit
    value:       { weight: 800, lineHeight: 1.2 },        // customer name and package name
    noImage:     { letterSpacing: '4px' },                // the "No Image" words
    idleTitle:   { weight: 900, letterSpacing: '4px' },   // "Welcome" in the welcome box
    idleMessage: { letterSpacing: '3px' }                 // "Waiting for next car"
  },

  // 10. SIZES AND SPACING
  // These are for a wide (landscape) screen. Sizes for a tall screen are in section 11.
  // padding = empty space inside the edge of something. gap = space between two things.
  display: {
    orientation: {
      // Only set forcePortrait to true if the TV is hung up tall
      // but the picture still shows up sideways.
      // On a normal TV, leave it false.
      forcePortrait:   false,
      rotateDirection: 'ccw'     // 'cw' turns it clockwise, 'ccw' the other way. If the picture is upside down, switch it.
    },
    header:        { padding: '10px 20px', borderWidth: '3px', blur: '20px', logoHeight: '38px' },   // top bar
    headlineBlock: { padding: '12px 16px 10px',                       // the words above the card
                     eyebrowGap: '3px', sublineGap: '4px',            // space under the top line, space over the bottom line
                     idleEyebrowGap: '6px', idleSublineGap: '8px' },  // same, but on the welcome screen
    content:       { padding: '0 16px 16px' },                        // space around the card
    card: {
      maxWidth:     '540px',     // widest the card can get
      borderWidth:  '3px',
      topBarHeight: '4px',       // colored bar across the top (matches the package color)
      imageHeight:  '44%',       // how much of the card the photo takes up
      blockPadding: '18px 26px', // space inside each row
      labelGap:     '10px'       // space between a small title and what's under it
    },
    noImage: { gap: '10px', jeepWidth: '110px' },   // shown when there's no car photo
    plate: {
      padding:        '12px 22px',
      borderWidth:    '3px',
      radius:         '7px',     // how round the corners are
      gap:            '10px',    // space between the screws and the number
      shadowOffset:   '4px',
      highlightWidth: '1px',     // thin shine along the top edge
      stripeInset:    '3px',     // how far the top stripe sits from the edge
      stripeHeight:   '4px',
      boltSize:       '12px',    // screw size
      boltBorder:     '1.5px',
      boltNudge:      '3px',     // moves the screws down a little
      textNudge:      '3px'      // moves the number down a little
    },
    package: { gap: '16px', badgeGap: '6px', badgeSize: '52px' },
    idle: {                      // welcome box
      maxWidth:    '540px',
      padding:     '50px 28px',
      borderWidth: '3px',
      jeepWidth:   '160px',
      jeepGap:     '20px',       // space under the jeep
      messageGap:  '10px'        // space over "Waiting for next car"
    },
    cornerStickers: { width: '140px', bottom: '18px', side: '18px', tilt: '8deg' },   // tilt = how much they lean
    waves:          { height: '70px', backOffset: '0px', middleOffset: '-8px', frontOffset: '-16px' }   // offset moves a wave up or down
  },

  // 11. TALL (PORTRAIT) SCREENS
  // When the screen is taller than it is wide (or forcePortrait is on),
  // these sizes are used instead of the ones above.
  responsive: {
    portraitQuery: '(orientation: portrait)',   // don't change
    portrait: {
      header:         { fontSize: '18px', padding: '10px 16px', gap: '8px', logoHeight: '42px' },
      clock:          { fontSize: '18px', letterSpacing: '2px' },
      headlineBlock:  { padding: '14px 20px 10px' },
      eyebrow:        { fontSize: '14px', letterSpacing: '5px', gap: '4px' },
      headline:       { fontSize: '42px', letterSpacing: '3px' },
      subline:        { fontSize: '16px', letterSpacing: '1px', gap: '6px' },
      content:        { padding: '0 20px 24px' },
      card: {
        fontSize:       '26px',  // text size inside the card. em sizes below are based on this (1.5em = 1.5 times this size)
        borderWidth:    '4px',
        topBarHeight:   '6px',
        bottomSpace:    '90px',  // space left under the card for the waves and jeeps
        imageMinHeight: '140px', // the photo fills any extra space, but never gets smaller than this
        blockPadding:   '16px 36px'
      },
      fieldLabel:     { fontSize: '0.7em', letterSpacing: '7px', gap: '16px' },
      plate: {
        padding: '18px 32px', borderWidth: '4px', radius: '10px', gap: '14px',
        shadowOffset: '5px', highlightWidth: '2px', stripeInset: '4px', stripeHeight: '5px',
        boltSize: '18px', boltBorder: '2px', boltNudge: '4px'
      },
      plateNumber:    { fontSize: '1.6em', letterSpacing: '12px' },
      value:          { fontSize: '1.25em' },
      package:        { gap: '22px', badgeGap: '10px', badgeSize: '82px' },
      noImage:        { jeepWidth: '180px' },
      idle: {                    // welcome box
        fontSize:    '26px',
        padding:     '60px 40px',
        borderWidth: '4px',
        minHeight:   55,         // % of the screen height
        bottomSpace: '200px',    // space left under the box
        jeepWidth:   '260px',
        jeepGap:     '32px'
      },
      idleTitle:      { fontSize: '1.8em', letterSpacing: '6px' },
      idleMessage:    { fontSize: '1em', letterSpacing: '4px', gap: '16px' },
      cornerStickers: { width: '100px', bottom: '18px', side: '24px' },
      waves:          { height: '90px' }
    }
  },

  // 12. MOVING PARTS
  animations: {
    enabled: true,               // false turns off all movement (no bubbles, waves stand still)
    bubbles: {
      enabled:     true,
      count:       14,                    // how many bubbles
      minSize:     5,  maxSize:     25,   // smallest and biggest bubble, in pixels
      minDuration: 9,  maxDuration: 25,   // seconds for a bubble to float up. Bigger number = slower
      maxDelay:    13                     // seconds. Bubbles start at random times so they don't all go at once
    },
    waves: {
      enabled:     true,         // false = waves don't move
      backSpeed:   '10s',        // seconds for one full loop. Bigger number = slower
      middleSpeed: '14s',        // this wave moves the other way
      frontSpeed:  '7s'
    }
  },

  // 13. TROUBLESHOOTING
  // Turn these on to see what's going on. On the computer, press F12 and open the Console tab.
  debug: {
    logging:   false,            // shows every check for cars and every screen change
    logErrors: false             // shows when the screen can't reach CleanTrak
  }
};
// END OF SETTINGS. You don't need to change anything below this line.

// Hand the settings above to the styles below, before the page shows up.
// Example: theme.colors.brand becomes --theme-colors-brand in the styles.
(function applyConfig(){
  const root = document.documentElement;
  function setVars(obj, name){
    for(const key in obj){
      const v = obj[key], n = name + '-' + key.replace(/[A-Z]/g, c => '-' + c.toLowerCase());
      if(v && typeof v === 'object') setVars(v, n);
      else if(typeof v === 'string' || typeof v === 'number') root.style.setProperty(n, v);
    }
  }
  ['theme','typography','display','responsive','animations'].forEach(s => setVars(CONFIG[s], '--' + s));

  // The waves are drawn shapes, so their colors get filled in here.
  const WAVE_SHAPES = {
    back:   'M0,60 C360,120 720,0 1080,60 C1260,90 1350,60 1440,60 L1440,120 L0,120 Z',
    middle: 'M0,80 C240,20 480,100 720,60 C960,20 1200,100 1440,80 L1440,120 L0,120 Z',
    front:  'M0,40 C480,100 960,0 1440,40 L1440,120 L0,120 Z'
  };
  for(const k in WAVE_SHAPES){
    const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1440 120'><path fill='${CONFIG.theme.waves[k]}' d='${WAVE_SHAPES[k]}'/></svg>`;
    root.style.setProperty(`--wave-${k}-image`, `url("data:image/svg+xml,${encodeURIComponent(svg)}")`);
  }

  document.title = CONFIG.general.pageTitle;
  if(CONFIG.branding.fontStylesheet){
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = CONFIG.branding.fontStylesheet;
    document.head.appendChild(link);
  }
})();
</script>
<style>
/* STYLES (how everything looks)
   Most of the values here come from the settings at the top of the file.
   Change them up there, not here. */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;width:100%;overflow:hidden;
  font-family:var(--typography-font-family);font-size:var(--typography-base-size);
  background:var(--theme-colors-background);color:var(--theme-colors-text);
}

.bg{
  position:fixed;inset:0;z-index:0;
  background:
    radial-gradient(ellipse 130% 45% at 50% -5%, var(--theme-colors-background-glow) 0%, transparent 60%),
    linear-gradient(180deg,var(--theme-colors-background) 0%,var(--theme-colors-background-end) 100%);
}

.bubbles{position:fixed;inset:0;z-index:1;pointer-events:none;}
.bubble{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle at 33% 33%,var(--theme-bubbles-center),var(--theme-bubbles-edge));
  border:1px solid var(--theme-bubbles-border);
  animation:rise linear infinite;
}
@keyframes rise{0%{transform:translateY(0) scale(1);opacity:.5}100%{transform:translateY(-108vh) scale(1.25);opacity:0}}

.waves{position:fixed;bottom:0;left:0;right:0;z-index:1;height:var(--display-waves-height);overflow:hidden;pointer-events:none;}
.wv{position:absolute;bottom:0;width:200%;height:100%;background-repeat:repeat-x;}
.wv1{background-image:var(--wave-back-image);background-size:50% 100%;animation:wm var(--animations-waves-back-speed) linear infinite;bottom:var(--display-waves-back-offset);}
.wv2{background-image:var(--wave-middle-image);background-size:50% 100%;animation:wm var(--animations-waves-middle-speed) linear infinite reverse;bottom:var(--display-waves-middle-offset);}
.wv3{background-image:var(--wave-front-image);background-size:50% 100%;animation:wm var(--animations-waves-front-speed) linear infinite;bottom:var(--display-waves-front-offset);}
@keyframes wm{from{transform:translateX(0)}to{transform:translateX(-50%)}}
body.waves-still .wv{animation:none;}

.jeep-sticker{
  position:fixed;bottom:var(--display-corner-stickers-bottom);right:var(--display-corner-stickers-side);z-index:2;
  width:var(--display-corner-stickers-width);opacity:var(--theme-opacity-corner-stickers);
  pointer-events:none;
  transform:rotate(calc(var(--display-corner-stickers-tilt) * -1));
}
.jeep-sticker.left{
  left:var(--display-corner-stickers-side);right:auto;
  transform:rotate(var(--display-corner-stickers-tilt)) scaleX(-1);
}

.screen{
  position:relative;z-index:3;
  height:100vh;width:100vw;
  display:flex;flex-direction:column;
}

/* Top bar (logo and clock) */
header{
  padding:var(--display-header-padding);
  display:flex;align-items:center;justify-content:space-between;
  background:var(--theme-header-background);backdrop-filter:blur(var(--display-header-blur));
  border-bottom:var(--display-header-border-width) solid var(--theme-colors-brand);
  flex-shrink:0;
  position:relative;
}
.logo{height:var(--display-header-logo-height);width:auto;object-fit:contain;}
.clock{font-size:var(--typography-base-size);font-weight:var(--typography-clock-weight);letter-spacing:var(--typography-clock-letter-spacing);font-variant-numeric:tabular-nums;}

/* Words above the card */
.ty{
  text-align:center;
  padding:var(--display-headline-block-padding);
  flex-shrink:0;
}
.ty-eye{font-size:var(--typography-base-size);font-weight:var(--typography-eyebrow-weight);letter-spacing:var(--typography-eyebrow-letter-spacing);text-transform:uppercase;color:var(--theme-colors-brand-light);opacity:var(--theme-opacity-eyebrow);margin-bottom:var(--display-headline-block-eyebrow-gap);display:block;}
.ty-head{
  font-size:var(--typography-base-size);font-weight:var(--typography-headline-weight);line-height:var(--typography-headline-line-height);letter-spacing:var(--typography-headline-letter-spacing);
  background:linear-gradient(170deg,var(--theme-colors-brand-light) 0%,var(--theme-headline-gradient-middle) 38%,var(--theme-colors-text) 58%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.ty-sub{font-size:var(--typography-base-size);font-weight:var(--typography-subline-weight);color:var(--theme-colors-text-muted);margin-top:var(--display-headline-block-subline-gap);letter-spacing:var(--typography-subline-letter-spacing);}

/* Bigger words on the welcome screen */
body.is-idle .ty-eye{font-size:clamp(var(--typography-idle-eyebrow-min),calc(var(--typography-idle-eyebrow-scale) * 1vw),var(--typography-idle-eyebrow-max));margin-bottom:var(--display-headline-block-idle-eyebrow-gap);}
body.is-idle .ty-sub{font-size:clamp(var(--typography-idle-subline-min),calc(var(--typography-idle-subline-scale) * 1vw),var(--typography-idle-subline-max));font-weight:var(--typography-idle-subline-weight);color:var(--theme-colors-text);margin-top:var(--display-headline-block-idle-subline-gap);}

/* Area that holds the card */
#display{
  flex:1;
  min-height:0;
  display:flex;
  align-items:stretch;
  justify-content:center;
  padding:var(--display-content-padding);
}

/* Car card */
.car-card{
  width:100%;max-width:var(--display-card-max-width);
  display:flex;flex-direction:column;
  overflow:hidden;
  border:var(--display-card-border-width) solid var(--theme-colors-dark);
  box-shadow:0 0 0 1px var(--pkg-color,var(--theme-colors-brand)),var(--theme-card-shadow);
  background:var(--theme-card-background);
  position:relative;
}
.car-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:var(--display-card-top-bar-height);
  background:linear-gradient(90deg,var(--pkg-color,var(--theme-colors-brand)),color-mix(in srgb,var(--pkg-color,var(--theme-colors-brand-light)) 60%,white),var(--pkg-color,var(--theme-colors-brand)));
  z-index:3;
}

.img-panel{
  flex:0 0 var(--display-card-image-height);
  position:relative;
  background:var(--theme-card-image-background);
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.img-panel::before{
  content:'';position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,transparent 60%,var(--theme-card-image-fade) 100%);
}
.veh-img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;opacity:var(--theme-opacity-vehicle-image);}
.no-img{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:var(--display-no-image-gap);}
.no-img-jeep{width:var(--display-no-image-jeep-width);opacity:var(--theme-opacity-no-image-jeep);}
.no-img p{font-size:var(--typography-base-size);letter-spacing:var(--typography-no-image-letter-spacing);text-transform:uppercase;color:var(--theme-card-no-image-text);}

.info-panel{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  border-top:1px solid var(--theme-colors-divider);
  min-height:0;
}
.info-block{
  flex:0 0 auto;
  display:flex;flex-direction:column;justify-content:center;
  padding:var(--display-card-block-padding);
  border-bottom:1px solid var(--theme-colors-divider);
}
.info-block:last-child{border-bottom:none;}

.flbl{
  font-size:var(--typography-base-size);font-weight:var(--typography-field-label-weight);letter-spacing:var(--typography-field-label-letter-spacing);
  text-transform:uppercase;color:var(--theme-colors-brand-light);opacity:var(--theme-opacity-field-label);
  margin-bottom:var(--display-card-label-gap);display:block;
}

.plate{
  display:inline-flex;align-items:center;gap:var(--display-plate-gap);
  align-self:flex-start;
  background:linear-gradient(175deg,var(--theme-plate-background-top) 0%,var(--theme-plate-background-bottom) 100%);
  border:var(--display-plate-border-width) solid var(--theme-colors-dark);border-radius:var(--display-plate-radius);padding:var(--display-plate-padding);position:relative;
  box-shadow:var(--display-plate-shadow-offset) var(--display-plate-shadow-offset) 0 var(--theme-plate-shadow),inset 0 var(--display-plate-highlight-width) 0 var(--theme-plate-highlight);
}
.plate::after{content:'';position:absolute;top:var(--display-plate-stripe-inset);left:var(--display-plate-stripe-inset);right:var(--display-plate-stripe-inset);height:var(--display-plate-stripe-height);background:linear-gradient(90deg,var(--theme-colors-brand),var(--theme-colors-brand-light),var(--theme-colors-brand));border-radius:2px 2px 0 0;}
.pbolt{width:var(--display-plate-bolt-size);height:var(--display-plate-bolt-size);border-radius:50%;flex-shrink:0;background:radial-gradient(circle at 35% 35%,var(--theme-plate-bolt-light),var(--theme-plate-bolt-dark));border:var(--display-plate-bolt-border) solid var(--theme-plate-bolt-border);box-shadow:var(--theme-plate-bolt-shadow);margin-top:var(--display-plate-bolt-nudge);}
.pnum{font-size:var(--typography-base-size);font-weight:var(--typography-plate-number-weight);color:var(--theme-colors-dark);letter-spacing:var(--typography-plate-number-letter-spacing);line-height:1;text-shadow:var(--theme-plate-text-shadow);margin-top:var(--display-plate-text-nudge);}

.pkg-row{display:flex;align-items:center;gap:var(--display-package-gap);}
.pkg-icon-duo{
  display:flex;align-items:center;gap:var(--display-package-badge-gap);flex-shrink:0;
}
.pkg-icon-duo img{
  height:var(--display-package-badge-size);width:var(--display-package-badge-size);object-fit:contain;
  mix-blend-mode:screen;
}
.pkg-name{font-size:var(--typography-base-size);font-weight:var(--typography-value-weight);line-height:var(--typography-value-line-height);color:var(--theme-colors-text);}

/* Welcome box (no car waiting) */
.idle{
  width:100%;max-width:var(--display-idle-max-width);
  text-align:center;padding:var(--display-idle-padding);
  background:var(--theme-card-background);border:var(--display-idle-border-width) solid var(--theme-colors-dark);
  box-shadow:0 0 0 1px var(--theme-idle-outline);
  align-self:center;
}
.idle-jeep{width:var(--display-idle-jeep-width);opacity:var(--theme-opacity-idle-jeep);margin:0 auto var(--display-idle-jeep-gap);display:block;}
.idle h2{
  font-size:var(--typography-base-size);font-weight:var(--typography-idle-title-weight);letter-spacing:var(--typography-idle-title-letter-spacing);
  text-transform:uppercase;color:var(--theme-idle-title-color);
  text-shadow:var(--theme-idle-title-shadow);
}
.idle p{font-size:var(--typography-base-size);color:var(--theme-idle-message-color);margin-top:var(--display-idle-message-gap);letter-spacing:var(--typography-idle-message-letter-spacing);text-transform:uppercase;}

/* Turns the whole page sideways for a TV that's hung up tall.
   Only used when forcePortrait is on (section 10 of the settings). */
body.force-portrait{
  position:absolute;
  width:100vh;     /* width and height are swapped because the page is turned */
  height:100vw;
  transform-origin:top left;
  overflow:hidden;
}
body.force-portrait.rot-cw{  top:0;    left:100%; transform:rotate(90deg);  }
body.force-portrait.rot-ccw{ top:100%; left:0;    transform:rotate(-90deg); }

/* Tall screens. Sizes come from section 11 of the settings.
   Used on a real tall screen and when forcePortrait is on. */
body.is-portrait header{
  font-size:var(--responsive-portrait-header-font-size);
  padding:var(--responsive-portrait-header-padding);
  gap:var(--responsive-portrait-header-gap);
}
body.is-portrait .logo{ height:var(--responsive-portrait-header-logo-height); }
body.is-portrait .clock{ font-size:var(--responsive-portrait-clock-font-size); letter-spacing:var(--responsive-portrait-clock-letter-spacing); }

body.is-portrait .ty{ padding:var(--responsive-portrait-headline-block-padding); }
body.is-portrait .ty-eye{ font-size:var(--responsive-portrait-eyebrow-font-size); letter-spacing:var(--responsive-portrait-eyebrow-letter-spacing); margin-bottom:var(--responsive-portrait-eyebrow-gap); }
body.is-portrait .ty-head{ font-size:var(--responsive-portrait-headline-font-size); letter-spacing:var(--responsive-portrait-headline-letter-spacing); }
body.is-portrait .ty-sub{ font-size:var(--responsive-portrait-subline-font-size); margin-top:var(--responsive-portrait-subline-gap); letter-spacing:var(--responsive-portrait-subline-letter-spacing); }

/* Put the card at the top so there's room for the waves under it */
body.is-portrait #display{ padding:var(--responsive-portrait-content-padding); align-items:flex-start; }

body.is-portrait .car-card{
  max-width:none;
  width:100%;
  height:calc(100% - var(--responsive-portrait-card-bottom-space));
  border-width:var(--responsive-portrait-card-border-width);
  font-size:var(--responsive-portrait-card-font-size);
}
body.is-portrait .car-card::before{ height:var(--responsive-portrait-card-top-bar-height); }

body.is-portrait .img-panel{ flex:1 1 auto; height:auto; min-height:var(--responsive-portrait-card-image-min-height); }   /* the photo takes the extra space so the info under it never gets cut off */
body.is-portrait .no-img-jeep{ width:var(--responsive-portrait-no-image-jeep-width); }

body.is-portrait .info-panel{ flex:none; }
body.is-portrait .info-block{ padding:var(--responsive-portrait-card-block-padding); }

body.is-portrait .flbl{
  font-size:var(--responsive-portrait-field-label-font-size);
  letter-spacing:var(--responsive-portrait-field-label-letter-spacing);
  margin-bottom:var(--responsive-portrait-field-label-gap);
}

body.is-portrait .plate{
  padding:var(--responsive-portrait-plate-padding);
  border-width:var(--responsive-portrait-plate-border-width);
  border-radius:var(--responsive-portrait-plate-radius);
  gap:var(--responsive-portrait-plate-gap);
  box-shadow:var(--responsive-portrait-plate-shadow-offset) var(--responsive-portrait-plate-shadow-offset) 0 var(--theme-plate-shadow),inset 0 var(--responsive-portrait-plate-highlight-width) 0 var(--theme-plate-highlight);
}
body.is-portrait .plate::after{ top:var(--responsive-portrait-plate-stripe-inset); left:var(--responsive-portrait-plate-stripe-inset); right:var(--responsive-portrait-plate-stripe-inset); height:var(--responsive-portrait-plate-stripe-height); }
body.is-portrait .pbolt{ width:var(--responsive-portrait-plate-bolt-size); height:var(--responsive-portrait-plate-bolt-size); border-width:var(--responsive-portrait-plate-bolt-border); margin-top:var(--responsive-portrait-plate-bolt-nudge); }
body.is-portrait .pnum{
  font-size:var(--responsive-portrait-plate-number-font-size);
  letter-spacing:var(--responsive-portrait-plate-number-letter-spacing);
}

body.is-portrait .pkg-row{ gap:var(--responsive-portrait-package-gap); }
body.is-portrait .pkg-icon-duo{ gap:var(--responsive-portrait-package-badge-gap); }
body.is-portrait .pkg-icon-duo img{ height:var(--responsive-portrait-package-badge-size); width:var(--responsive-portrait-package-badge-size); }
body.is-portrait .pkg-name{ font-size:var(--responsive-portrait-value-font-size); }

/* Welcome box on tall screens */
body.is-portrait .idle{
  max-width:none;
  width:100%;
  height:auto;
  min-height:calc(var(--responsive-portrait-idle-min-height) * 1vh);
  align-self:flex-end;
  margin-bottom:var(--responsive-portrait-idle-bottom-space);
  padding:var(--responsive-portrait-idle-padding);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  border-width:var(--responsive-portrait-idle-border-width);
  font-size:var(--responsive-portrait-idle-font-size);
}
body.is-portrait .idle-jeep{ width:var(--responsive-portrait-idle-jeep-width); margin-bottom:var(--responsive-portrait-idle-jeep-gap); }
body.is-portrait .idle h2{ font-size:var(--responsive-portrait-idle-title-font-size); letter-spacing:var(--responsive-portrait-idle-title-letter-spacing); }
body.is-portrait .idle p{ font-size:var(--responsive-portrait-idle-message-font-size); letter-spacing:var(--responsive-portrait-idle-message-letter-spacing); margin-top:var(--responsive-portrait-idle-message-gap); }

body.is-portrait .jeep-sticker{ width:var(--responsive-portrait-corner-stickers-width); bottom:var(--responsive-portrait-corner-stickers-bottom); right:var(--responsive-portrait-corner-stickers-side); }
body.is-portrait .jeep-sticker.left{ left:var(--responsive-portrait-corner-stickers-side); right:auto; }
body.is-portrait .waves{ height:var(--responsive-portrait-waves-height); }

/* Fixes for when forcePortrait is on. The page is turned, so the screen's
   width and height are swapped. Keep these at the bottom or they won't work. */
body.force-portrait .screen{ width:100%; height:100%; }
body.force-portrait header{                                  /* blur doesn't work on some TVs when the page is turned */
  backdrop-filter:none;
  background:var(--theme-header-background-rotated);
}
body.force-portrait .idle{ min-height:calc(var(--responsive-portrait-idle-min-height) * 1vw); }
body.force-portrait.is-idle .ty-eye{ font-size:clamp(var(--typography-idle-eyebrow-min),calc(var(--typography-idle-eyebrow-scale) * 1vh),var(--typography-idle-eyebrow-max)); }
body.force-portrait.is-idle .ty-sub{ font-size:clamp(var(--typography-idle-subline-min),calc(var(--typography-idle-subline-scale) * 1vh),var(--typography-idle-subline-max)); }
</style>
</head>
<body>
<div class="bg"></div>
<div class="bubbles" id="bubbles"></div>
<div class="waves"><div class="wv wv1"></div><div class="wv wv2"></div><div class="wv wv3"></div></div>

<img class="jeep-sticker" alt="">
<img class="jeep-sticker left" alt="">

<div class="screen">
  <header>
    <img class="logo" id="logo">
    <div class="clock" id="clock">—</div>
  </header>

  <div class="ty">
    <span class="ty-eye" id="eyebrow"></span>
    <div class="ty-head" id="headline"></div>
    <div class="ty-sub" id="subline"></div>
  </div>

  <div id="display"></div>
</div>

<script>
// The code that runs the screen. To change how it works, use the settings at the top.
const FEAT = CONFIG.features;
const TEXT = CONFIG.text;
const QUEUE_URL = `http://${CONFIG.api.ip}:${CONFIG.api.port}${CONFIG.api.queueEndpoint}?tunnel=${encodeURIComponent(CONFIG.api.tunnelId)}`;

let currentCarId = null;
let idleTimer    = null;

function log(...args){ if(CONFIG.debug.logging) console.log('[queue]', ...args); }

// Put in the logo and jeeps, and hide anything turned off in section 7
(()=>{
  const logo=document.getElementById('logo');
  logo.src=CONFIG.branding.logo;
  logo.alt=CONFIG.branding.name;
  document.querySelectorAll('.jeep-sticker').forEach(el=>el.src=CONFIG.branding.jeepSticker);

  // hide them instead of removing them, so the logo and clock stay on their own sides
  const hide=sel=>document.querySelectorAll(sel).forEach(el=>el.style.visibility='hidden');
  if(!FEAT.showLogo)           hide('#logo');
  if(!FEAT.showClock)          hide('#clock');
  if(!FEAT.showCornerStickers) hide('.jeep-sticker');
  if(!FEAT.showWaves)          hide('.waves');
  if(!FEAT.showHeadline)       document.querySelector('.ty').style.display='none';

  const A=CONFIG.animations;
  if(!A.enabled || !A.waves.enabled) document.body.classList.add('waves-still');
})();

// Check if the screen is tall or wide, and turn the page if forcePortrait is on
function applyOrientation(){
  const {forcePortrait, rotateDirection} = CONFIG.display.orientation;
  const realPortrait = window.matchMedia(CONFIG.responsive.portraitQuery).matches;
  const portrait = forcePortrait || realPortrait;

  document.body.classList.toggle('is-portrait', portrait);
  document.body.classList.toggle('force-portrait', forcePortrait);
  document.body.classList.toggle('rot-cw',  forcePortrait && rotateDirection === 'cw');
  document.body.classList.toggle('rot-ccw', forcePortrait && rotateDirection === 'ccw');
}

// Make the bubbles
(()=>{
  const B=CONFIG.animations.bubbles;
  if(!CONFIG.animations.enabled || !B.enabled) return;
  const c=document.getElementById('bubbles');
  for(let i=0;i<B.count;i++){
    const b=document.createElement('div');b.className='bubble';
    const s=B.minSize+Math.random()*(B.maxSize-B.minSize);
    b.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;bottom:${-5-Math.random()*8}%;animation-duration:${B.minDuration+Math.random()*(B.maxDuration-B.minDuration)}s;animation-delay:${Math.random()*B.maxDelay}s`;
    c.appendChild(b);
  }
})();

// Clock
(function tick(){
  const C=CONFIG.general.clock;
  document.getElementById('clock').textContent=new Date().toLocaleTimeString(C.locale,C.format);
  setTimeout(tick,C.updateInterval);
})();

// Find the package in section 4 that matches this package name
function pkgRule(n){
  n=(n||'').toLowerCase();
  return CONFIG.packages.rules.find(r=>n.includes(r.match.toLowerCase()));
}

function pkgColor(n){
  const r=pkgRule(n);
  return (r && r.color) || CONFIG.packages.defaultColor;
}

function pkgIconHtml(n){
  const r=pkgRule(n);
  return FEAT.showPackageBadge && r && r.badge
    ? `<div class="pkg-icon-duo"><img src="${r.badge}" alt="${r.badgeAlt||''}" onerror="this.closest('.pkg-icon-duo').remove()"></div>`
    : '';
}

// Clean up the car's status so "in queue", "In-Queue" and "IN_QUEUE" all count as the same
function normState(s){
  return (s||'').toUpperCase().trim().replace(/[\s-]+/g,'_');
}

// Is this car the next one going into the tunnel? It has to (see section 3):
//   - be in the right spot in line
//   - have the right status
//   - be in this tunnel (both tunnels share one list of cars)
//   - have enough photos. The second photo is taken at the roller-up,
//     which is how we know this is the car going in.
function isNextUp(c){
  const Q=CONFIG.queue;
  return Number(c.position_in_queue) === Q.nextUpPosition
      && normState(c.state) === normState(Q.nextUpState)
      && c.tunnel === CONFIG.api.tunnelId
      && (c.image_urls||[]).length >= Q.minImages;
}

// Ghost wash = the package name is blank or has the ghost word in it (section 4)
function isGhostWash(n){
  n=(n||'').toLowerCase().trim();
  return n==='' || n.includes(CONFIG.packages.ghostKeyword.toLowerCase());
}

// Make the first letter of each name a capital.
// "john smith" becomes "John Smith", and "o'brien" becomes "O'Brien".
function capitalizeName(str){
  return (str||'')
    .toLowerCase()
    .replace(/(^|[\s\-'])([a-z])/g, function(_, sep, ch){ return sep + ch.toUpperCase(); });
}

// Sometimes CleanTrak puts the whole name in the first name and leaves the last name empty.
// When that happens, split it up: the first word is the first name, the rest is the last name.
function splitName(first, last){
  first = (first || '').trim();
  last  = (last  || '').trim();

  if(first && !last){
    var parts = first.split(/\s+/);
    if(parts.length > 1){
      first = parts.shift();
      last  = parts.join(' ');
    }
  }
  return { first: capitalizeName(first), last: capitalizeName(last) };
}

// Shrink the plate number if it's too long to fit on the card
function fitPlate(){
  const plate=document.querySelector('.plate');
  const pnum=document.querySelector('.pnum');
  if(!plate||!pnum) return;
  const block=plate.parentElement;
  // undo any shrinking from last time so we measure the normal size
  pnum.style.fontSize='';
  pnum.style.letterSpacing='';
  requestAnimationFrame(()=>{
    const cs=getComputedStyle(pnum);
    const baseSize=parseFloat(cs.fontSize);
    const baseSpace=parseFloat(cs.letterSpacing)||0;
    const bcs=getComputedStyle(block);
    const avail=block.clientWidth-parseFloat(bcs.paddingLeft)-parseFloat(bcs.paddingRight);
    if(plate.offsetWidth>avail){
      const ratio=avail/plate.offsetWidth;
      pnum.style.fontSize=(baseSize*ratio)+'px';
      pnum.style.letterSpacing=(baseSpace*ratio)+'px';
    }
  });
}

// What shows in place of the car photo when there isn't one
function noImageHtml(){
  return `<div class="no-img"><img class="no-img-jeep" src="${CONFIG.branding.jeepSticker}" alt=""><p>${TEXT.noImage}</p></div>`;
}

// The car photo. If the photo doesn't load, show "No Image" instead.
function buildImgPanel(imgUrl){
  const panel=document.createElement('div');panel.className='img-panel';
  if(imgUrl){
    const img=document.createElement('img');img.className='veh-img';img.alt=TEXT.vehicleAlt;
    img.addEventListener('error',function(){
      this.remove();
      panel.innerHTML=noImageHtml();
    });
    img.src=imgUrl;panel.appendChild(img);
  } else {
    panel.innerHTML=noImageHtml();
  }
  return panel;
}

// Go back to the welcome screen if the car isn't seen again for a while (holdTime in section 3)
function resetIdleTimer(){
  clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{
    currentCarId=null;
    renderIdle();
  }, CONFIG.queue.holdTime);
}

// Change the words above the card
function setHeadline(t){
  document.getElementById('eyebrow').textContent=t.eyebrow;
  document.getElementById('headline').textContent=t.headline;
  document.getElementById('subline').textContent=t.subline;
}

// Show a car on the screen
function renderCar(car){
  currentCarId=car.invoice_id;
  log('showing car', car.invoice_id);
  document.body.classList.remove('is-idle');
  const plate=(car.license_plate||TEXT.unknownPlate).toUpperCase();
  const pkg=car.wash_package_name||'';
  // Use the photo picked in section 3. If it's missing, use the first photo.
  const imgs=car.image_urls||[];
  const imgUrl=imgs[CONFIG.queue.preferredImage]||imgs[0]||null;
  const color=pkgColor(pkg);
  const name=splitName(car.customer_first_name,car.customer_last_name);
  const customerName=name.first||TEXT.guestName;

  setHeadline(TEXT.car);

  // The package row. If the package has a badge (like Ultimate), it shows next to the name.
  // Ghost washes don't get a package row at all.
  const pkgBlock=(!FEAT.showWashPackage || isGhostWash(pkg)) ? '' : `
    <div class="info-block">
      <span class="flbl">${TEXT.labels.package}</span>
      <div class="pkg-row">${pkgIconHtml(pkg)}<div class="pkg-name" style="color:${color}">${pkg}</div></div>
    </div>`;

  const customerBlock=!FEAT.showCustomerName ? '' : `
      <div class="info-block">
        <span class="flbl">${TEXT.labels.customer}</span>
        <div class="pkg-name">${customerName}</div>
      </div>`;

  const card=document.createElement('div');
  card.className='car-card';
  card.style.setProperty('--pkg-color',color);
  card.dataset.invoiceId=car.invoice_id;
  card.innerHTML=`
    <div class="info-panel">
      <div class="info-block">
        <span class="flbl">${TEXT.labels.plate}</span>
        <div class="plate"><div class="pbolt"></div><div class="pnum">${plate}</div><div class="pbolt"></div></div>
      </div>
      ${customerBlock}
      ${pkgBlock}
    </div>`;
  if(FEAT.showVehicleImage) card.prepend(buildImgPanel(imgUrl));

  const display=document.getElementById('display');
  display.innerHTML='';
  display.appendChild(card);
  fitPlate();
}

// Show the welcome screen
function renderIdle(){
  currentCarId=null;
  log('idle');
  document.body.classList.add('is-idle');
  setHeadline(TEXT.idle);
  document.getElementById('display').innerHTML=`
    <div class="idle">
      <img class="idle-jeep" src="${CONFIG.branding.jeepSticker}" alt="">
      <h2>${TEXT.idle.title}</h2>
      <p>${TEXT.idle.message}</p>
    </div>`;
}

// Ask CleanTrak for the list of cars and show the one that's next
async function poll(){
  try{
    const r=await fetch(QUEUE_URL,{headers:{accept:"application/json",authorization:`${CONFIG.api.authScheme} ${CONFIG.api.apiKey}`}});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const allCars=(await r.json()).cars||[];

    // Keep only the car that's next up. There should only be one, but if there's
    // more than one, use the one that was changed most recently.
    const sorted=allCars
      .filter(isNextUp)
      .sort((a,b)=>new Date(b.wash_edit_time)-new Date(a.wash_edit_time));
    log(`${allCars.length} cars in queue, ${sorted.length} next up`);

    if(sorted.length===0) return; // no car next up. The screen goes back to welcome on its own.

    const candidate=sorted[0];
    const invoiceId=candidate.invoice_id;

    // Same car as before, so just keep it up longer
    if(invoiceId===currentCarId){
      resetIdleTimer();
      return;
    }

    // A new car is next, so show it
    renderCar(candidate);
    resetIdleTimer();

  }catch(e){
    // Couldn't reach CleanTrak. Keep showing what's there and try again next time.
    if(CONFIG.debug.logErrors) console.error('[queue] poll failed:', e);
  }
}

// Check the screen shape first so it looks right from the start
applyOrientation();

// Show the welcome screen, then keep checking for cars
renderIdle();
poll();
setInterval(poll,CONFIG.api.pollInterval);

// Fix the layout if the screen size or direction changes
window.addEventListener('resize',()=>{applyOrientation();fitPlate();});
window.addEventListener('orientationchange',()=>{applyOrientation();fitPlate();});
</script>
</body>
</html>
